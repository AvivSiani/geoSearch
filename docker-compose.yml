# Dev and test MongoDB: the tool registry (Stage 3) and, with
# GEOSEARCH_CONVERSATION__STORE=mongodb, conversations (Stage 6).
#   docker compose up -d
services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
