[project]
name = "geosearch"
version = "0.1.0"
description = "GeoSearch Agent: a generic, spatially grounded agent"
readme = "README.md"
authors = [
    { name = "Aviv Siani", email = "avivsiani120@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.8.0",
    "shapely>=2.0",
    "uvicorn>=0.54.0",
    # Stage 2: pinned exactly (deepagents 0.7.x is beta; LangChain v1 middleware
    # APIs move between minors). See SPECS stage-2 §5.
    "deepagents==0.7.21",
    "langchain==1.4.3",
    "langgraph==1.2.12",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.6.7",
    "pyyaml==6.0.3",
    # Stage 3: the tool registry (sync PyMongo; see SPECS stage 3).
    "pymongo==4.18.2",
    # Stage 5: the Google Places provider (also the test client's transport).
    "httpx>=0.28.1",
]

[project.scripts]
geosearch-registry = "geosearch.registry.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
